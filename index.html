<!DOCTYPE html>
<html lang="vi">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;700&display=swap" rel="stylesheet" />

    <!-- CSS -->

<body>

<!-- HEADER STICKY -->
<header class="site-header">
    <div class="container header-flex">
        <!-- LOGO = TRANG CHỦ -->
        <a href="index.html" class="logo" aria-label="Bida Store trang chủ">🎱 BIDA STORE</a>

        <nav class="nav" aria-label="Điều hướng chính">
            <a href="products.html">Sản phẩm</a>
            <a href="services.html">Dịch vụ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html">Liên hệ</a>
        </nav>
    </div>
</header>

<main>
    <!-- HERO -->
    <section class="hero" role="banner">
        <div class="container hero-content">
            <h1>DỤNG CỤ BIDA CHUYÊN NGHIỆP</h1>
            <p>Chính hãng – Chất lượng cao – Giá tốt</p>
            <a href="products.html" class="btn">Xem sản phẩm</a>
        </div>
    </section>

    <!-- SẢN PHẨM NỔI BẬT -->
    <section class="products container" aria-labelledby="featured-products">

        <div class="product-list">
            <article class="product">
                <img src="images/cue.jpg" alt="Cơ bida cao cấp" loading="lazy" />

                <p class="price">1.500.000đ</p>
            </article>

                <h4>Phấn bida</h4>
                <p class="price">80.000đ</p>
            </article>

                <img src="images/gangtay.jpg" alt="Găng tay bida" loading="lazy" />
                <h4>Găng tay bida</h4>
                <p class="price">120.000đ</p>
            </article>

            <article class="product">
                <img src="images/bi.jpg" alt="Bộ bi bida" loading="lazy" />
                <h4>Bộ bi bida</h4>
                <p class="price">950.000đ</p>
